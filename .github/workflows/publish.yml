name: Generate and publish article

on:
  schedule:
    # 毎週月曜 21:00 UTC = 日本時間 火曜 6:00
    - cron: "0 21 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Generate article
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          AMAZON_ASSOC_TAG: ${{ vars.AMAZON_ASSOC_TAG }}
          RAKUTEN_AFFILIATE_ID: ${{ vars.RAKUTEN_AFFILIATE_ID }}
          SITE_URL: ${{ vars.SITE_URL }}
          SITE_NAME: ${{ vars.SITE_NAME }}
        run: python generate_article.py

      - name: Commit and push if changed
        run: |
          git config user.name "affiliate-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Auto-publish article ($(date -u +%Y-%m-%d))"
          git push
